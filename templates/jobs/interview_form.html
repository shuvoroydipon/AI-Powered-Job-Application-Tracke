<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>{{ title }} - AI Job Tracker</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>


<body class="bg-light">


<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <a
            href="{% url 'dashboard' %}"
            class="navbar-brand"
        >
            🤖 AI Job Tracker
        </a>

    </div>

</nav>


<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-7">

            <div class="card shadow border-0">

                <div class="card-body p-4">

                    <h2 class="mb-2">
                        {{ title }}
                    </h2>

                    <p class="text-muted mb-4">

                        Job:
                        <strong>
                            {{ application.job_title }}
                        </strong>

                        at

                        <strong>
                            {{ application.company_name }}
                        </strong>

                    </p>


                    <form method="POST">

                        {% csrf_token %}


                        {% for field in form %}

                            <div class="mb-3">

                                <label class="form-label fw-semibold">

                                    {{ field.label }}

                                </label>

                                {{ field }}

                                {% if field.errors %}

                                    <div class="text-danger small mt-1">

                                        {{ field.errors }}

                                    </div>

                                {% endif %}

                            </div>

                        {% endfor %}


                        <div class="d-flex gap-2 mt-4">

                            <button
                                type="submit"
                                class="btn btn-primary"
                            >
                                Save Interview
                            </button>


                            <a
                                href="{% url 'application_detail' application.pk %}"
                                class="btn btn-secondary"
                            >
                                Cancel
                            </a>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>


</body>

</html>
