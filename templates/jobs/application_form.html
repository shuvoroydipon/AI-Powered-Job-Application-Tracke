<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>{{ title }}</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <a
            href="{% url 'dashboard' %}"
            class="navbar-brand"
        >
            AI Job Tracker
        </a>

        <a
            href="{% url 'application_list' %}"
            class="btn btn-outline-light"
        >
            Applications
        </a>

    </div>

</nav>


<div class="container mt-5 mb-5">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="card shadow">

                <div class="card-body p-4">

                    <h2 class="mb-4">
                        {{ title }}
                    </h2>

                    <form method="POST">

                        {% csrf_token %}

                        {% for field in form %}

                            <div class="mb-3">

                                <label
                                    class="form-label"
                                >
                                    {{ field.label }}
                                </label>

                                {{ field }}

                                {% if field.errors %}

                                    <div class="text-danger mt-1">

                                        {{ field.errors }}

                                    </div>

                                {% endif %}

                            </div>

                        {% endfor %}

                        <div class="d-flex gap-2">

                            <button
                                type="submit"
                                class="btn btn-primary"
                            >
                                Save Application
                            </button>

                            <a
                                href="{% url 'application_list' %}"
                                class="btn btn-secondary"
                            >
                                Cancel
                            </a>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

</body>

</html>
